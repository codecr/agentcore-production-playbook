<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img">
<title>Figure 6.1 — Three kinds of state, three layers</title>
<desc>Conversational state, working state, and long-term memory occupy different layers of the agent architecture.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .title { font-size: 18px; font-weight: 600; fill: #1a1a1a; }
  .subtitle { font-size: 14px; fill: #4a4a4a; font-style: italic; }
  .layer-title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
  .layer-subtitle { font-size: 13px; fill: #4a4a4a; font-style: italic; }
  .cell-title { font-size: 11px; fill: #4a4a4a; }
  .cell-value { font-size: 11px; fill: #1a1a1a; font-style: italic; }
  .example-label { font-size: 12px; fill: #1a1a1a; font-weight: 600; }
  .example-text { font-size: 12px; fill: #2a2a2a; }
  .test-title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .test-text { font-size: 13px; fill: #2a2a2a; }
  .caption { font-size: 12px; fill: #4a4a4a; font-style: italic; }
  .layer-blue { fill: #E3F2FD; stroke: #1565C0; }
  .layer-green { fill: #E8F5E9; stroke: #2E7D32; }
  .layer-amber { fill: #FFF8E1; stroke: #FF8F00; }
  .cell { fill: #f5f5f5; stroke: #cccccc; }
  .test-box { fill: #FFEBEE; stroke: #C62828; }
</style>

<text x="360" y="32" text-anchor="middle" dominant-baseline="central" class="title">Three kinds of state</text>
<text x="360" y="54" text-anchor="middle" dominant-baseline="central" class="subtitle">Each has its own layer. Mixing them produces operational mistakes.</text>

<!-- Layer 1: Conversation state -->
<rect x="40" y="90" width="640" height="160" rx="12" class="layer-blue" stroke-width="1.5"/>
<text x="60" y="115" class="layer-title">Conversation state</text>
<text x="60" y="135" class="layer-subtitle">The messages — what was said in this conversation</text>

<rect x="60" y="155" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="155" y="167" text-anchor="middle" class="cell-title">Scope</text>
<text x="155" y="183" text-anchor="middle" class="cell-value">Single conversation</text>

<rect x="265" y="155" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="360" y="167" text-anchor="middle" class="cell-title">Retention</text>
<text x="360" y="183" text-anchor="middle" class="cell-value">Conversation lifetime</text>

<rect x="470" y="155" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="565" y="167" text-anchor="middle" class="cell-title">Where it lives</text>
<text x="565" y="183" text-anchor="middle" class="cell-value">Framework session mgr</text>

<text x="60" y="215" class="example-label">Example:</text>
<text x="60" y="232" class="example-text">"What did the user ask three turns ago?" — Strands FileSessionManager, LangGraph state, etc.</text>

<!-- Layer 2: Working state -->
<rect x="40" y="265" width="640" height="160" rx="12" class="layer-green" stroke-width="1.5"/>
<text x="60" y="290" class="layer-title">Working state — Chapter 6</text>
<text x="60" y="310" class="layer-subtitle">What the agent built — files, dependencies, artifacts</text>

<rect x="60" y="330" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="155" y="342" text-anchor="middle" class="cell-title">Scope</text>
<text x="155" y="358" text-anchor="middle" class="cell-value">Single session ID</text>

<rect x="265" y="330" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="360" y="342" text-anchor="middle" class="cell-title">Retention</text>
<text x="360" y="358" text-anchor="middle" class="cell-value">14 days idle / version update</text>

<rect x="470" y="330" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="565" y="342" text-anchor="middle" class="cell-title">Where it lives</text>
<text x="565" y="358" text-anchor="middle" class="cell-value">AgentCore Session Storage</text>

<text x="60" y="390" class="example-label">Example:</text>
<text x="60" y="407" class="example-text">"The Markdown runbooks the agent drafted, the git history, the installed packages."</text>

<!-- Layer 3: Long-term memory -->
<rect x="40" y="440" width="640" height="160" rx="12" class="layer-amber" stroke-width="1.5"/>
<text x="60" y="465" class="layer-title">Long-term memory — Chapter 7</text>
<text x="60" y="485" class="layer-subtitle">What the agent learned — patterns, reflections, summaries</text>

<rect x="60" y="505" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="155" y="517" text-anchor="middle" class="cell-title">Scope</text>
<text x="155" y="533" text-anchor="middle" class="cell-value">Across sessions and users</text>

<rect x="265" y="505" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="360" y="517" text-anchor="middle" class="cell-title">Retention</text>
<text x="360" y="533" text-anchor="middle" class="cell-value">Configurable, long</text>

<rect x="470" y="505" width="190" height="35" rx="6" class="cell" stroke-width="0.5"/>
<text x="565" y="517" text-anchor="middle" class="cell-title">Where it lives</text>
<text x="565" y="533" text-anchor="middle" class="cell-value">AgentCore Memory</text>

<text x="60" y="565" class="example-label">Example:</text>
<text x="60" y="582" class="example-text">"This ticket pattern has appeared 7 times this quarter, suggesting a systemic issue."</text>

<!-- The test -->
<rect x="40" y="620" width="640" height="60" rx="10" class="test-box" stroke-width="0.5"/>
<text x="360" y="640" text-anchor="middle" class="test-title">The test for which layer applies</text>
<text x="360" y="660" text-anchor="middle" class="test-text">Ask: "What should happen to this state when the user starts a new conversation?"</text>

<text x="360" y="705" text-anchor="middle" class="caption">Figure 6.1 — Three kinds of state, three layers. Each has the storage mechanism designed for it.</text>
</svg>
